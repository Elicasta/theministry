<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living With Purpose</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f}#lwp-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0f}
</style>
</head>
<body>
<iframe id="lwp-core" title="Living With Purpose" allow="fullscreen" allowfullscreen></iframe>
<script type="text/plain" id="lwp-question-css">
.qa-item.question-live{background:rgba(198,164,106,.06);border-left:2px solid var(--gold);padding-left:9px}.qa-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.question-wall{position:absolute;inset:0;z-index:36;display:flex;align-items:center;justify-content:center;padding:8vh 7vw;overflow:hidden;background:radial-gradient(circle at 78% 18%,rgba(145,166,154,.14),transparent 34%),linear-gradient(135deg,#080a0c,#10161c 58%,#0a0d10)}.question-wall:before{content:'';position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:52px 52px}.question-wall-inner{position:relative;z-index:2;width:min(86vw,1450px)}.question-wall-kicker{font-family:var(--fc);font-size:clamp(.85rem,1.35vw,1.35rem);font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}.question-wall-text{font-family:var(--fp);font-size:clamp(2.2rem,4.8vw,6rem);line-height:1.12;color:var(--ink);max-width:1350px;text-wrap:balance}.question-wall-text:before{content:'“';color:var(--gold);font-size:1.35em;line-height:0;vertical-align:-.13em;margin-right:.05em}.question-wall-rule{width:110px;height:3px;background:var(--gold);margin:30px 0 18px}.question-wall-foot{font-family:var(--fc);font-size:clamp(.65rem,1vw,1rem);font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
@media(max-width:600px){.question-wall{padding:9vh 7vw}.question-wall-text{font-size:clamp(1.9rem,7vw,3rem)}}
</script>
<script type="text/plain" id="lwp-question-js">
(function(){
  if(window.__lwpQuestionDisplayInstalled)return;
  window.__lwpQuestionDisplayInstalled=true;
  state.activeQuestion=null;

  const projector=document.getElementById('projector');
  if(projector&&!document.getElementById('question-wall')){
    const wall=document.createElement('div');
    wall.id='question-wall';
    wall.className='question-wall hidden';
    wall.innerHTML='<div class="question-wall-inner"><div class="question-wall-kicker">Anonymous Question</div><div id="question-wall-text" class="question-wall-text"></div><div class="question-wall-rule"></div><div class="question-wall-foot">Living With Purpose · Anonymous Q&amp;A</div></div>';
    const blackout=document.getElementById('blackout');
    if(blackout)projector.insertBefore(wall,blackout);else projector.appendChild(wall);
  }

  function questionKey(q,i){return String((q&&(q.id||q.client_question_id))||i)}
  function questionIsLive(q,i){return !!state.activeQuestion&&state.activeQuestion.id===questionKey(q,i)}
  function renderQuestionWall(){
    const wall=document.getElementById('question-wall');
    if(!wall)return;
    if(state.activeQuestion&&String(state.activeQuestion.text||'').trim()){
      const text=document.getElementById('question-wall-text');
      if(text)text.textContent=state.activeQuestion.text;
      wall.classList.remove('hidden');
    }else wall.classList.add('hidden');
  }

  window.displayQuestion=function(i){
    const q=questionRows&&questionRows[i];
    if(!q||!String(q.text||'').trim())return;
    state.overlay=null;
    state.black=false;
    state.constellation=null;
    state.activePoll=null;
    state.activeQuestion={id:questionKey(q,i),text:String(q.text).trim()};
    send();
  };
  window.closeQuestion=function(){state.activeQuestion=null;send()};

  const originalRenderRemoteData=renderRemoteData;
  renderRemoteData=function(){
    originalRenderRemoteData();
    const list=document.getElementById('question-list');
    if(!list||!Array.isArray(questionRows))return;
    const items=[...list.querySelectorAll('.qa-item')];
    items.forEach((item,i)=>{
      const q=questionRows[i];
      if(!q)return;
      const live=questionIsLive(q,i);
      item.classList.toggle('question-live',live);
      let actions=item.querySelector('.qa-actions');
      if(!actions){actions=document.createElement('div');actions.className='qa-actions';item.appendChild(actions)}
      actions.innerHTML='';
      const button=document.createElement('button');
      button.className='btn small '+(live?'on':'primary');
      button.textContent=live?'Hide from Main':'Display on Main';
      button.addEventListener('click',()=>live?closeQuestion():displayQuestion(i));
      actions.appendChild(button);
    });
  };

  const originalSetRemoteCue=setRemoteCue;
  setRemoteCue=function(){
    originalSetRemoteCue();
    if(!state.activeQuestion)return;
    const num=document.getElementById('now-num'),title=document.getElementById('now-title'),type=document.getElementById('now-type'),notes=document.getElementById('now-notes'),cue=document.getElementById('next-cue'),next=document.getElementById('next-btn');
    if(num)num.textContent='Q';
    if(title)title.textContent='Anonymous Question';
    if(type)type.textContent='Live question · main screen';
    if(notes)notes.textContent=state.activeQuestion.text;
    if(cue)cue.innerHTML='<strong>Next</strong>Hide question and return to slide';
    if(next)next.textContent='Hide Question';
  };

  const originalSetProjector=setProjector;
  setProjector=function(){originalSetProjector();renderQuestionWall()};

  const originalGoTo=goTo;
  goTo=function(i){state.activeQuestion=null;originalGoTo(i)};
  const originalNextSlide=nextSlide;
  nextSlide=async function(){if(state.activeQuestion){closeQuestion();return}return originalNextSlide()};
  const originalPrevSlide=prevSlide;
  prevSlide=function(){if(state.activeQuestion){closeQuestion();return}return originalPrevSlide()};
  const originalPushVerse=pushVerse;
  pushVerse=function(i){state.activeQuestion=null;return originalPushVerse(i)};
  const originalToggleBlack=toggleBlack;
  toggleBlack=function(){state.activeQuestion=null;return originalToggleBlack()};
  const originalLaunchPoll=launchPoll;
  launchPoll=function(id){state.activeQuestion=null;return originalLaunchPoll(id)};
  const originalShowPollResults=showPollResults;
  showPollResults=async function(id){state.activeQuestion=null;return originalShowPollResults(id)};
  const originalRevealConstellation=revealConstellation;
  revealConstellation=async function(){state.activeQuestion=null;return originalRevealConstellation()};
  const originalToggleConstellation=toggleConstellation;
  toggleConstellation=async function(){state.activeQuestion=null;return originalToggleConstellation()};

  if(document.getElementById('remote')){renderRemoteData();setRemoteCue()}
  if(projector)renderQuestionWall();
})();
</script>
<script>
const frame=document.getElementById('lwp-core');
frame.src='/living-with-purpose-core.html'+location.search+location.hash;
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    const style=d.createElement('style');
    style.textContent=document.getElementById('lwp-question-css').textContent;
    d.head.appendChild(style);
    w.eval(document.getElementById('lwp-question-js').textContent);
  }catch(e){console.error('Question display enhancement failed',e)}
});
</script>
</body>
</html>
