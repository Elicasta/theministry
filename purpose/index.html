<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living With Purpose · Student Portal</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f}#purpose-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0f}
</style>
</head>
<body>
<iframe id="purpose-core" title="Living With Purpose Student Portal"></iframe>
<script type="text/plain" id="purpose-journey-css">
.purpose-current{position:relative;z-index:1;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#0b0e12;padding:10px 12px;font-family:var(--fc);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center}.purpose-current strong{font-family:var(--fd);font-size:1.25rem;letter-spacing:.04em;color:var(--gold);text-transform:uppercase}.idk-row{position:relative;z-index:1;margin-top:8px}.idk-btn{width:100%;border-style:dashed!important;background:rgba(145,166,154,.06)!important;color:#c0cbc5!important}.idk-btn.selected{border-color:var(--sage)!important;background:rgba(145,166,154,.14)!important;color:#e5eee9!important}.purpose-phase-final{border-color:rgba(145,166,154,.7)!important;background:radial-gradient(circle at 100% 0,rgba(145,166,154,.16),transparent 45%),rgba(17,21,26,.97)!important}.purpose-phase-final .ey{color:var(--sage)!important}.purpose-phase-final .word-row .btn.primary{background:var(--sage);border-color:var(--sage);color:#101611}.purpose-phase-final:after{content:'NOW';color:rgba(145,166,154,.05)}
</script>
<script type="text/plain" id="purpose-journey-js">
(function(){
  if(window.__lwpPurposeJourneyInstalled)return;
  window.__lwpPurposeJourneyInstalled=true;

  const card=document.querySelector('.poll-card');
  if(!card)return;
  const ey=card.querySelector('.ey');
  const q=card.querySelector('.poll-q');
  const hint=card.querySelector('.hint');
  const row=card.querySelector('.word-row');
  const input=document.getElementById('purpose-word');
  const submit=row&&row.querySelector('button');
  const stateEl=document.getElementById('purpose-word-state');
  const note=card.querySelector('.poll-note');

  let current=document.getElementById('purpose-current');
  if(!current){
    current=document.createElement('div');
    current.id='purpose-current';
    current.className='purpose-current';
    if(row)row.insertAdjacentElement('afterend',current);
  }
  let idkWrap=document.getElementById('purpose-idk-row');
  if(!idkWrap){
    idkWrap=document.createElement('div');
    idkWrap.id='purpose-idk-row';
    idkWrap.className='idk-row';
    idkWrap.innerHTML='<button id="purpose-idk" class="btn idk-btn" type="button">IDK — I DON\'T KNOW YET</button>';
    current.insertAdjacentElement('beforebegin',idkWrap);
  }
  const idkBtn=document.getElementById('purpose-idk');

  function isFinalPhase(){return !!(liveState&&liveState.started&&Number(liveState.slide)>=42)}
  function savedWord(){return String(localStorage.getItem('lwp_purpose_word')||'').trim()}
  function refreshJourney(){
    const finalPhase=isFinalPhase();
    const saved=savedWord();
    card.classList.toggle('purpose-phase-final',finalPhase);
    if(ey)ey.textContent=finalPhase?'Final Purpose Check':'Opening Purpose Check';
    if(q)q.textContent=finalPhase?'After tonight, what one word describes your purpose now?':'What one word describes your sense of purpose right now?';
    if(hint)hint.textContent=finalPhase?'Replace the word you started with — including IDK — with the word you are leaving with.':'Give the word you would use right now. If you genuinely do not know yet, IDK is a valid starting point.';
    if(submit)submit.textContent=finalPhase?'Replace With My Word':(saved?'Update My Starting Word':'Save My Starting Word');
    if(note)note.textContent=finalPhase?'This replaces your opening answer for the final constellation. Your old and new words will not be counted twice.':'This answer stays with you through the lesson. At the end, come back and replace it if your understanding of your purpose becomes clearer.';
    if(current)current.innerHTML='<span>Current saved purpose</span><strong>'+esc(saved||'Not answered')+'</strong>';
    if(idkBtn){idkBtn.classList.toggle('selected',saved.toUpperCase()==='IDK');idkBtn.textContent=finalPhase?(saved.toUpperCase()==='IDK'?'STILL IDK':'IDK — I STILL DON\'T KNOW'):'IDK — I DON\'T KNOW YET'}
    if(input&&saved.toUpperCase()==='IDK'&&document.activeElement!==input)input.value='';
    if(input)input.placeholder=finalPhase?'Your purpose word…':'One word…';
    if(stateEl&&saved){stateEl.textContent=finalPhase?'Current answer ready to replace':'Starting answer saved';stateEl.className='save-state ok'}
  }

  async function savePurposeAnswer(raw){
    let word=cleanWord(raw);
    if(!email||!validEmail(email)){if(stateEl){stateEl.textContent='Enter the lesson first';stateEl.className='save-state err'}return}
    if(!word){if(stateEl){stateEl.textContent='Type one word or choose IDK';stateEl.className='save-state err'}return}
    if(/\s/.test(word)){if(stateEl){stateEl.textContent='One word only';stateEl.className='save-state err'}return}
    if(word.length>32){if(stateEl){stateEl.textContent='Keep it under 32 characters';stateEl.className='save-state err'}return}
    if(word.toUpperCase()==='I DONT KNOW'||word.toUpperCase()==="I DON'T KNOW")word='IDK';
    const finalPhase=isFinalPhase();
    if(stateEl){stateEl.textContent=finalPhase?'Updating…':'Saving…';stateEl.className='save-state'}
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),6500);
      const r=await fetch('/api/poll-vote-submit',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({series_slug:SERIES,lesson_slug:LESSON,vote:{poll_id:PURPOSE_POLL,pollId:PURPOSE_POLL,question:'What one word describes your purpose?',answer:word,email,session_id:sessionId,anonymous:true,id:PURPOSE_POLL+'_'+sessionId}})});
      clearTimeout(timer);
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||'Could not save word');
      localStorage.setItem('lwp_purpose_word',word);
      localStorage.setItem('lwp_purpose_phase',finalPhase?'final':'opening');
      if(input)input.value=word==='IDK'?'':word;
      if(stateEl){stateEl.textContent=finalPhase?'Updated for final constellation':'Starting answer saved';stateEl.className='save-state ok'}
      refreshJourney();
      toast(finalPhase?'Purpose updated':'Starting purpose saved');
    }catch(e){if(stateEl){stateEl.textContent=e&&e.name==='AbortError'?'Save timed out · try again':'Could not save';stateEl.className='save-state err'}}
  }

  window.submitPurposeWord=function(){savePurposeAnswer(input&&input.value)};
  if(idkBtn)idkBtn.addEventListener('click',()=>savePurposeAnswer('IDK'));

  const originalRenderLive=renderLive;
  renderLive=function(){const out=originalRenderLive.apply(this,arguments);refreshJourney();return out};
  const originalRenderAll=renderAll;
  renderAll=function(){const out=originalRenderAll.apply(this,arguments);refreshJourney();return out};

  let fallbackBusy=false;
  async function fallbackSync(){
    if(fallbackBusy||document.hidden||!sbUrl||!sbKey)return;
    fallbackBusy=true;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),2600);
    try{
      const r=await fetch(sbUrl+'/rest/v1/sync_state?id=eq.1&select=payload',{headers:{apikey:sbKey,Authorization:'Bearer '+sbKey},cache:'no-store',signal:controller.signal});
      if(!r.ok)throw new Error('sync '+r.status);
      const rows=await r.json();
      const raw=rows&&rows[0]&&rows[0].payload;
      const msg=typeof raw==='string'?JSON.parse(raw):raw;
      if(msg&&msg.type==='lwp_state'&&msg.room===ROOM&&msg.state){handle(msg);setSync(true,'Following live')}
    }catch(e){if(!navigator.onLine)setSync(false,'Offline')}
    finally{clearTimeout(timer);fallbackBusy=false}
  }
  setInterval(fallbackSync,3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(fallbackSync,100)});
  window.addEventListener('online',fallbackSync);
  setTimeout(fallbackSync,900);
  refreshJourney();
})();
</script>
<script>
const frame=document.getElementById('purpose-core');
frame.src='/purpose/core.html'+location.search+location.hash;
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    const style=d.createElement('style');
    style.textContent=document.getElementById('purpose-journey-css').textContent;
    d.head.appendChild(style);
    w.eval(document.getElementById('purpose-journey-js').textContent);
  }catch(e){console.error('Purpose journey enhancement failed',e)}
});
</script>
</body>
</html>
