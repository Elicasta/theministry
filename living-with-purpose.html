<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living With Purpose</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f;color:#f4efe5;font-family:Arial,sans-serif}#lwp-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0f}.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0b0d0f}.boot.hidden{display:none}.boot-box{text-align:center;max-width:440px;padding:24px}.boot-title{font-size:22px;font-weight:800;letter-spacing:.04em}.boot-copy{font-size:13px;line-height:1.5;color:#87919b;margin-top:10px}.boot-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.boot-btn{display:none;border:1px solid #c6a46a;background:#c6a46a;color:#17130c;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.boot-btn.secondary{background:transparent;color:#f4efe5;border-color:#39434d}.boot.slow #boot-btn{display:block}.boot.degraded #boot-btn,.boot.degraded #boot-continue{display:block}
</style>
</head>
<body>
<iframe id="lwp-core" title="Living With Purpose" allow="fullscreen" allowfullscreen></iframe>
<div id="boot" class="boot"><div class="boot-box"><div class="boot-title">Living With Purpose</div><div id="boot-copy" class="boot-copy">Loading presentation…</div><div class="boot-actions"><button id="boot-btn" class="boot-btn" type="button">Retry Presentation</button><button id="boot-continue" class="boot-btn secondary" type="button">Continue Basic Presentation</button></div></div></div>
<script>
const frame=document.getElementById('lwp-core');
const boot=document.getElementById('boot');
const bootCopy=document.getElementById('boot-copy');
const bootBtn=document.getElementById('boot-btn');
const bootContinue=document.getElementById('boot-continue');
let booted=false,bootTimer=null;
function coreUrl(){const u=new URL('/living-with-purpose-core.html',location.origin);for(const[k,v]of new URLSearchParams(location.search))u.searchParams.set(k,v);u.searchParams.set('_lwp','hardened-20260822c');u.hash=location.hash;return u.pathname+u.search+u.hash}
function armBootTimer(){clearTimeout(bootTimer);bootTimer=setTimeout(()=>{if(!booted){boot.classList.add('slow');bootCopy.textContent='The presentation is taking longer than expected. You can retry without changing your presentation link.'}},7000)}
function loadCore(){booted=false;boot.classList.remove('hidden','slow','degraded');bootCopy.textContent='Loading presentation…';armBootTimer();frame.src=coreUrl()}
function injectEnhancements(){return new Promise((resolve,reject)=>{try{const d=frame.contentDocument;if(!d||!d.head)throw new Error('Presentation document unavailable');const link=d.createElement('link');link.rel='stylesheet';link.href='/lwp-enhancements.css?v=20260822c';d.head.appendChild(link);const s=d.createElement('script');s.src='/lwp-enhancements.js?v=20260822c';s.onload=resolve;s.onerror=()=>reject(new Error('Enhancement script failed'));d.body.appendChild(s)}catch(e){reject(e)}})}
bootBtn.addEventListener('click',()=>{frame.src='about:blank';setTimeout(loadCore,80)});
bootContinue.addEventListener('click',()=>{booted=true;clearTimeout(bootTimer);boot.classList.add('hidden')});
frame.addEventListener('load',async()=>{if(frame.src==='about:blank')return;try{await injectEnhancements();booted=true;clearTimeout(bootTimer);boot.classList.add('hidden')}catch(e){console.error('Presentation enhancement failed',e);clearTimeout(bootTimer);const isProjector=new URLSearchParams(location.search).get('view')==='projector';if(isProjector){booted=true;boot.classList.add('hidden')}else{boot.classList.remove('slow');boot.classList.add('degraded');bootCopy.textContent='The core presentation loaded, but the extra live controls did not. Retry, or continue with the basic slide/Scripture presentation.'}}});
frame.addEventListener('error',()=>{boot.classList.add('slow');bootCopy.textContent='The presentation could not load. Check the connection and retry.'});
loadCore();
</script>
</body>
</html>
