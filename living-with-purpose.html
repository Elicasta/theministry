<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living With Purpose</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f;color:#f4efe5;font-family:Arial,sans-serif}#lwp-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0f}.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0b0d0f}.boot.hidden{display:none}.boot-box{text-align:center;max-width:420px;padding:24px}.boot-title{font-size:22px;font-weight:800;letter-spacing:.04em}.boot-copy{font-size:13px;line-height:1.5;color:#87919b;margin-top:10px}.boot-btn{display:none;margin:16px auto 0;border:1px solid #c6a46a;background:#c6a46a;color:#17130c;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.boot.slow .boot-btn{display:block}
</style>
</head>
<body>
<iframe id="lwp-core" title="Living With Purpose" allow="fullscreen" allowfullscreen></iframe>
<div id="boot" class="boot"><div class="boot-box"><div class="boot-title">Living With Purpose</div><div id="boot-copy" class="boot-copy">Loading presentation…</div><button id="boot-btn" class="boot-btn" type="button">Retry Presentation</button></div></div>
<script type="text/plain" id="lwp-question-css">
.qa-item.question-live{background:rgba(198,164,106,.06);border-left:2px solid var(--gold);padding-left:9px}.qa-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.question-wall{position:absolute;inset:0;z-index:36;display:flex;align-items:center;justify-content:center;padding:8vh 7vw;overflow:hidden;background:radial-gradient(circle at 78% 18%,rgba(145,166,154,.14),transparent 34%),linear-gradient(135deg,#080a0c,#10161c 58%,#0a0d10)}.question-wall:before{content:'';position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:52px 52px}.question-wall-inner{position:relative;z-index:2;width:min(86vw,1450px);max-height:84vh;overflow:hidden}.question-wall-kicker{font-family:var(--fc);font-size:clamp(.85rem,1.35vw,1.35rem);font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}.question-wall-text{font-family:var(--fp);font-size:clamp(2.2rem,4.8vw,6rem);line-height:1.12;color:var(--ink);max-width:1350px;text-wrap:balance}.question-wall-text.question-medium{font-size:clamp(1.7rem,3.7vw,4.4rem)}.question-wall-text.question-long{font-size:clamp(1.25rem,2.45vw,2.8rem);line-height:1.08}.question-wall-text:before{content:'“';color:var(--gold);font-size:1.35em;line-height:0;vertical-align:-.13em;margin-right:.05em}.question-wall-rule{width:110px;height:3px;background:var(--gold);margin:30px 0 18px}.question-wall-foot{font-family:var(--fc);font-size:clamp(.65rem,1vw,1rem);font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
@media(max-width:600px){.question-wall{padding:9vh 7vw}.question-wall-text{font-size:clamp(1.9rem,7vw,3rem)}.question-wall-text.question-medium{font-size:clamp(1.5rem,5.5vw,2.4rem)}.question-wall-text.question-long{font-size:clamp(1.08rem,4vw,1.7rem)}}
</script>
<script type="text/plain" id="lwp-question-js">
(function(){
  if(window.__lwpQuestionDisplayInstalled)return;
  window.__lwpQuestionDisplayInstalled=true;
  state.activeQuestion=null;

  const projector=document.getElementById('projector');
  if(projector&&!document.getElementById('question-wall')){
    const wall=document.createElement('div');
    wall.id='question-wall';
    wall.className='question-wall hidden';
    wall.innerHTML='<div class="question-wall-inner"><div class="question-wall-kicker">Anonymous Question</div><div id="question-wall-text" class="question-wall-text"></div><div class="question-wall-rule"></div><div class="question-wall-foot">Living With Purpose · Anonymous Q&amp;A</div></div>';
    const blackout=document.getElementById('blackout');
    if(blackout)projector.insertBefore(wall,blackout);else projector.appendChild(wall);
  }

  function questionKey(q,i){return String((q&&(q.id||q.client_question_id||q.question_id))||i)}
  function questionIsLive(q,i){return !!state.activeQuestion&&state.activeQuestion.id===questionKey(q,i)}
  function renderQuestionWall(){
    const wall=document.getElementById('question-wall');
    if(!wall)return;
    if(state.activeQuestion&&String(state.activeQuestion.text||'').trim()){
      const text=document.getElementById('question-wall-text');
      if(text){
        const value=String(state.activeQuestion.text).trim();
        text.textContent=value;
        text.classList.toggle('question-medium',value.length>180&&value.length<=430);
        text.classList.toggle('question-long',value.length>430);
      }
      wall.classList.remove('hidden');
    }else wall.classList.add('hidden');
  }

  window.displayQuestion=function(i){
    const q=questionRows&&questionRows[i];
    if(!q||!String(q.text||'').trim())return;
    state.overlay=null;
    state.black=false;
    state.constellation=null;
    state.activePoll=null;
    state.activeQuestion={id:questionKey(q,i),text:String(q.text).trim()};
    send();
  };
  window.closeQuestion=function(){state.activeQuestion=null;send()};

  const originalRenderRemoteData=renderRemoteData;
  renderRemoteData=function(){
    originalRenderRemoteData();
    const list=document.getElementById('question-list');
    if(!list||!Array.isArray(questionRows))return;
    const items=[...list.querySelectorAll('.qa-item')];
    items.forEach((item,i)=>{
      const q=questionRows[i];
      if(!q)return;
      const live=questionIsLive(q,i);
      item.classList.toggle('question-live',live);
      let actions=item.querySelector('.qa-actions');
      if(!actions){actions=document.createElement('div');actions.className='qa-actions';item.appendChild(actions)}
      actions.innerHTML='';
      const button=document.createElement('button');
      button.className='btn small '+(live?'on':'primary');
      button.textContent=live?'Hide from Main':'Display on Main';
      button.addEventListener('click',()=>live?closeQuestion():displayQuestion(i));
      actions.appendChild(button);
    });
  };

  const originalSetRemoteCue=setRemoteCue;
  setRemoteCue=function(){
    originalSetRemoteCue();
    if(!state.activeQuestion)return;
    const num=document.getElementById('now-num'),title=document.getElementById('now-title'),type=document.getElementById('now-type'),notes=document.getElementById('now-notes'),cue=document.getElementById('next-cue'),next=document.getElementById('next-btn');
    if(num)num.textContent='Q';
    if(title)title.textContent='Anonymous Question';
    if(type)type.textContent='Live question · main screen';
    if(notes)notes.textContent=state.activeQuestion.text;
    if(cue)cue.innerHTML='<strong>Next</strong>Hide question and return to slide';
    if(next)next.textContent='Hide Question';
  };

  const originalSetProjector=setProjector;
  setProjector=function(){originalSetProjector();renderQuestionWall()};

  const originalGoTo=goTo;
  goTo=function(i){state.activeQuestion=null;originalGoTo(i)};
  const originalNextSlide=nextSlide;
  nextSlide=async function(){if(state.activeQuestion){closeQuestion();return}return originalNextSlide()};
  const originalPrevSlide=prevSlide;
  prevSlide=function(){if(state.activeQuestion){closeQuestion();return}return originalPrevSlide()};
  const originalPushVerse=pushVerse;
  pushVerse=function(i){state.activeQuestion=null;return originalPushVerse(i)};
  const originalToggleBlack=toggleBlack;
  toggleBlack=function(){state.activeQuestion=null;return originalToggleBlack()};
  const originalLaunchPoll=launchPoll;
  launchPoll=function(id){state.activeQuestion=null;return originalLaunchPoll(id)};
  const originalShowPollResults=showPollResults;
  showPollResults=async function(id){state.activeQuestion=null;return originalShowPollResults(id)};
  const originalRevealConstellation=revealConstellation;
  revealConstellation=async function(){state.activeQuestion=null;return originalRevealConstellation()};
  const originalToggleConstellation=toggleConstellation;
  toggleConstellation=async function(){state.activeQuestion=null;return originalToggleConstellation()};

  if(document.getElementById('remote')){renderRemoteData();setRemoteCue()}
  if(projector)renderQuestionWall();
})();
</script>
<script type="text/plain" id="lwp-hardening-js">
(function(){
  if(window.__lwpPresentationHardeningInstalled)return;
  window.__lwpPresentationHardeningInstalled=true;

  const SYNC_FRESH_MS=2*60*60*1000;
  const WRITE_TIMEOUT_MS=3200;
  const READ_TIMEOUT_MS=2800;
  const remoteSession='lwp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
  let syncSeq=0;
  let pendingMsg=null;
  let writeBusy=false;
  let lastAppliedTs=0;
  let lastAppliedSession='';
  let lastAppliedSeq=0;

  function normalizeModes(){
    if(state.black){state.overlay=null;state.activePoll=null;state.activeQuestion=null;state.constellation=null;return}
    if(state.activeQuestion){state.overlay=null;state.activePoll=null;state.constellation=null;return}
    if(state.constellation&&state.constellation.open){state.overlay=null;state.activePoll=null;state.activeQuestion=null;return}
    if(state.activePoll&&state.activePoll.id){state.overlay=null;state.activeQuestion=null;state.constellation=null;return}
    if(state.overlay){state.activePoll=null;state.activeQuestion=null;state.constellation=null}
  }

  async function timedFetch(url,opts,timeout){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeout);
    try{return await fetch(url,{...(opts||{}),signal:controller.signal})}
    finally{clearTimeout(timer)}
  }

  async function flushLatest(){
    if(view!=='remote'||writeBusy||!pendingMsg||!sbUrl||!sbKey)return;
    writeBusy=true;
    const msg=pendingMsg;
    try{
      const r=await timedFetch(sbUrl+'/rest/v1/sync_state',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':sbKey,'Authorization':'Bearer '+sbKey,'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({id:1,payload:JSON.stringify(msg),updated_at:new Date().toISOString()})
      },WRITE_TIMEOUT_MS);
      if(!r.ok)throw new Error('sync '+r.status);
      if(pendingMsg===msg)pendingMsg=null;
      try{setStatus(true,'Live sync')}catch(e){}
    }catch(e){
      try{setStatus(false,navigator.onLine?'Retrying sync':'Offline · retrying')}catch(x){}
    }finally{
      writeBusy=false;
      if(pendingMsg)setTimeout(flushLatest,120);
    }
  }

  send=function(){
    normalizeModes();
    state.ts=Date.now();
    state.sync={session:remoteSession,seq:++syncSeq};
    const msg={type:'lwp_state',room:ROOM,state:payload()};
    try{if(!bc)bc=new BroadcastChannel(CHANNEL);bc.postMessage(msg)}catch(e){}
    pendingMsg=msg;
    flushLatest();
    if(view==='remote'){
      try{setRemoteCue()}catch(e){console.error('Remote cue render failed',e)}
    }
  };

  const originalHandle=handle;
  handle=function(msg){
    if(!msg||msg.type!=='lwp_state'||msg.room!==ROOM||!msg.state)return;
    const incoming=msg.state;
    const meta=incoming.sync||null;
    const ts=Number(incoming.ts)||0;
    if(meta&&meta.session){
      const seq=Number(meta.seq)||0;
      if(meta.session===lastAppliedSession&&seq&&seq<=lastAppliedSeq)return;
      if(ts&&lastAppliedTs&&ts<lastAppliedTs)return;
      lastAppliedSession=String(meta.session);
      lastAppliedSeq=seq;
    }else if(ts&&lastAppliedTs&&ts<=lastAppliedTs)return;
    if(ts)lastAppliedTs=Math.max(lastAppliedTs,ts);
    try{return originalHandle(msg)}catch(e){
      console.error('Presentation state render failed',e);
      try{state={...state,...incoming};if(view==='remote')setRemoteCue();else setProjector()}catch(x){console.error('Presentation recovery render failed',x)}
    }
  };

  async function readLatestState(){
    if(view!=='projector'||document.hidden||!sbUrl||!sbKey)return;
    try{
      const r=await timedFetch(sbUrl+'/rest/v1/sync_state?id=eq.1&select=payload',{headers:{apikey:sbKey,Authorization:'Bearer '+sbKey},cache:'no-store'},READ_TIMEOUT_MS);
      if(!r.ok)return;
      const rows=await r.json();
      const raw=rows&&rows[0]&&rows[0].payload;
      const msg=typeof raw==='string'?JSON.parse(raw):raw;
      if(!msg||msg.type!=='lwp_state'||msg.room!==ROOM||!msg.state)return;
      const age=Date.now()-(Number(msg.state.ts)||0);
      if(age>=0&&age<SYNC_FRESH_MS)handle(msg);
    }catch(e){}
  }

  function guardFunction(name,delay){
    const fn=window[name];
    if(typeof fn!=='function')return;
    let last=0;
    window[name]=function(){
      const now=performance.now();
      if(now-last<delay)return;
      last=now;
      return fn.apply(this,arguments);
    };
  }

  if(view==='remote'){
    state.overlay=null;
    state.black=false;
    state.constellation=null;
    state.activePoll=null;
    state.activeQuestion=null;
    ['nextSlide','prevSlide','goTo','pushVerse','toggleBlack','launchPoll','showPollResults','displayQuestion','revealConstellation','toggleConstellation'].forEach(name=>guardFunction(name,180));
    setInterval(flushLatest,1500);
    window.addEventListener('online',()=>{flushLatest();setTimeout(()=>send(),120)});
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){
        try{loadRemoteData()}catch(e){}
        flushLatest();
        setTimeout(()=>send(),180);
      }
    });
    window.addEventListener('pageshow',()=>{flushLatest()});
  }else{
    setInterval(readLatestState,2500);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)readLatestState()});
    window.addEventListener('online',readLatestState);
    setTimeout(readLatestState,900);
  }

  window.addEventListener('error',e=>console.error('Presentation runtime error',e.error||e.message));
  window.addEventListener('unhandledrejection',e=>console.error('Presentation async error',e.reason));
})();
</script>
<script>
const frame=document.getElementById('lwp-core');
const boot=document.getElementById('boot');
const bootCopy=document.getElementById('boot-copy');
const bootBtn=document.getElementById('boot-btn');
let booted=false;
function coreUrl(){const u=new URL('/living-with-purpose-core.html',location.origin);for(const [k,v] of new URLSearchParams(location.search))u.searchParams.set(k,v);u.searchParams.set('_lwp','hardened-20260822');u.hash=location.hash;return u.pathname+u.search+u.hash}
function loadCore(){booted=false;boot.classList.remove('hidden','slow');bootCopy.textContent='Loading presentation…';frame.src=coreUrl()}
const slowTimer=setTimeout(()=>{if(!booted){boot.classList.add('slow');bootCopy.textContent='The presentation is taking longer than expected. You can retry without changing your presentation link.'}},7000);
bootBtn.addEventListener('click',()=>{frame.src='about:blank';setTimeout(loadCore,80)});
frame.addEventListener('load',()=>{
  if(frame.src==='about:blank')return;
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    if(!d||!w||!d.body)throw new Error('Presentation document unavailable');
    const style=d.createElement('style');
    style.textContent=document.getElementById('lwp-question-css').textContent;
    d.head.appendChild(style);
    w.eval(document.getElementById('lwp-question-js').textContent);
    w.eval(document.getElementById('lwp-hardening-js').textContent);
    booted=true;
    clearTimeout(slowTimer);
    boot.classList.add('hidden');
  }catch(e){
    console.error('Presentation enhancement failed',e);
    boot.classList.add('slow');
    bootCopy.textContent='The presentation loaded, but a control enhancement failed. Retry before going live.';
  }
});
frame.addEventListener('error',()=>{boot.classList.add('slow');bootCopy.textContent='The presentation could not load. Check the connection and retry.'});
loadCore();
</script>
</body>
